services:
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  backend:
    build: ./backend
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
    ports: ["8000:8000"]
    depends_on: [redis]
  worker:
    build: ./backend
    command: celery -A app.tasks.celery_app.celery_app worker --loglevel=INFO
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on: [redis]
  frontend:
    build: ./frontend
    ports: ["5173:80"]
    depends_on: [backend]
